<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — Гоголь барбершоп</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --color-primary-ink: #1d1d1f;
  --color-mid-gray: #707070;
  --color-hairline: #d6d6d6;
  --color-canvas: #f5f5f7;
  --color-paper: #ffffff;
  --color-cool-wash: #e8e8ed;
  --color-electric-blue: #0071e3;
  --color-ember: #b64400;
  --font-display: 'SF Pro Display', 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-text: 'SF Pro Text', 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --radius-input: 12px;
  --radius-buttons: 980px;
}

* { box-sizing: border-box; }

body {
  margin: 0; min-height: 100vh; display: flex; flex-direction: column;
  background: var(--color-paper); color: var(--color-primary-ink);
  font-family: var(--font-text); font-size: 17px; line-height: 25px; letter-spacing: -0.022em;
  -webkit-font-smoothing: antialiased;
}

.globalnav {
  height: 44px; background: rgba(250,250,252,0.86); backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--color-hairline);
  display: flex; align-items: center; justify-content: center;
}
.wordmark { font-family: var(--font-display); font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }

main {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 80px 24px 120px; text-align: center;
}
.eyebrow { margin: 0 0 12px; font-size: 17px; color: var(--color-mid-gray); }
h1 {
  margin: 0; font-family: var(--font-display); font-size: 80px; line-height: 84px;
  letter-spacing: -1.2px; font-weight: 600;
}
.lede { margin: 20px 0 0; font-size: 21px; line-height: 29px; letter-spacing: 0.231px; color: var(--color-mid-gray); }

form { width: min(100%, 380px); margin-top: 48px; text-align: left; }
label { display: block; font-size: 14px; line-height: 18px; letter-spacing: -0.224px; color: var(--color-mid-gray); margin-bottom: 8px; }
input {
  width: 100%; font-family: inherit; font-size: 17px; line-height: 25px; letter-spacing: -0.022em;
  color: var(--color-primary-ink); background: var(--color-canvas);
  border: 1px solid transparent; border-radius: var(--radius-input); padding: 12px 16px; outline: none;
}
input:hover { background: var(--color-cool-wash); }
input:focus { background: var(--color-paper); border-color: var(--color-primary-ink); }

button {
  width: 100%; margin-top: 20px; font-family: inherit; font-size: 17px; font-weight: 400;
  letter-spacing: -0.022em; background: var(--color-electric-blue); color: var(--color-paper);
  border: 0; border-radius: var(--radius-buttons); padding: 12px 22px; cursor: pointer;
}
button:hover { background: #0077ed; }

.err { margin: 0 0 20px; font-size: 14px; line-height: 18px; color: var(--color-ember); font-weight: 500; }
.hidden { display: none; }

@media (max-width: 734px) {
  h1 { font-size: 40px; line-height: 48px; letter-spacing: -0.2px; }
}
</style>
</head>
<body>

<nav class="globalnav"><span class="wordmark">Гоголь</span></nav>

<main>
  <p class="eyebrow">Гоголь барбершоп</p>
  <h1>Админка.</h1>
  <p class="lede">Цены и фотографии сайта — в одном месте.</p>

  <form method="post" action="/admin/login">
    <p class="err hidden" id="err">Неверный пароль. Попробуй ещё раз.</p>
    <label for="password">Пароль</label>
    <input type="password" id="password" name="password" autocomplete="current-password" autofocus required>
    <button type="submit">Войти</button>
  </form>
</main>

<script>
  if (new URLSearchParams(location.search).has('e')) {
    document.getElementById('err').classList.remove('hidden');
  }
</script>
</body>
</html>
