# Публичный доступ к сайту «Гоголь».
#
# Слушает ТОЛЬКО порт 8081. На 80/443/8080 у соседей свои server-блоки,
# в том числе default_server в конфиге suupr, — сюда мы не лезем совсем.
# На 8081 других блоков нет, поэтому этот становится единственным и
# перехватить чужой трафик физически не может.
#
# Ставится: /etc/nginx/sites-available/gogol + симлинк в sites-enabled.

server {
    listen 8081;
    listen [::]:8081;
    server_name _;

    access_log /var/log/nginx/gogol.access.log;
    error_log  /var/log/nginx/gogol.error.log;

    # В админке грузятся фото, лимит приложения — 10 МБ. Даём запас,
    # иначе nginx отрежет запрос раньше, чем приложение объяснит причину.
    client_max_body_size 12m;

    # Сайт — открыт всем.
    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Админка и её API наружу не публикуются совсем.
    #
    # Причина: сертификата пока нет (домен не оплачен), значит пароль ушёл бы
    # по открытому HTTP. Привязать к IP тоже нельзя — провайдер выдаёт разные
    # адреса из подсети (в логах видели .36, .116, .238), а разрешать весь
    # 188.241.241.0/24 — это пустить заодно всех соседей провайдера.
    #
    # Работать с админкой нужно через SSH-туннель: он шифрован и идёт прямо
    # в приложение на 127.0.0.1:8790, минуя этот блок.
    #     ssh -N -L 8899:127.0.0.1:8790 promouters-prod
    #     затем http://localhost:8899/admin
    #
    # Если админка всё же нужна из браузера без туннеля — заменить `deny all`
    # на `allow 188.241.241.0/24; deny all;`, но только после выпуска
    # сертификата, иначе пароль поедет открытым текстом.
    location /admin {
        deny all;
    }

    location /api {
        deny all;
    }
}
